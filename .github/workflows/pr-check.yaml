name: PR Check

on:
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      hml:  ${{ steps.filter.outputs.hml }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            hml:
              - 'hml/**'
              - 'modules/**'
            prod:
              - 'prod/**'
              - 'modules/**'

  plan-hml:
    needs: detect
    if: needs.detect.outputs.hml == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: hml
    env:
      TF_VAR_db_master_password:      ${{ secrets.DB_MASTER_PASSWORD }}
      TF_VAR_db_order_app_password:   ${{ secrets.DB_PASSWORD_HML }}
      TF_VAR_db_billing_app_password: ${{ secrets.DB_BILLING_PASSWORD_HML }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~> 1.10" }

      - name: Fmt + Validate + Plan HML
        id: plan
        run: |
          BUCKET="auto-repair-shop-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          terraform fmt -check -recursive ../
          terraform init -backend-config="bucket=${BUCKET}"
          terraform validate
          terraform plan -no-color 2>&1 | tee plan.txt

      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const plan = require('fs').readFileSync('hml/plan.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: '## HML Plan\n```\n' + plan.slice(0, 50000) + '\n```'
            });

  plan-prod:
    needs: detect
    if: needs.detect.outputs.prod == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: prod
    env:
      TF_VAR_db_master_password:      ${{ secrets.DB_MASTER_PASSWORD }}
      TF_VAR_db_order_app_password:   ${{ secrets.DB_PASSWORD_PROD }}
      TF_VAR_db_billing_app_password: ${{ secrets.DB_BILLING_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~> 1.10" }

      - name: Fmt + Validate + Plan PROD
        id: plan
        run: |
          BUCKET="auto-repair-shop-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          terraform fmt -check -recursive ../
          terraform init -backend-config="bucket=${BUCKET}"
          terraform validate
          terraform plan -no-color 2>&1 | tee plan.txt

      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const plan = require('fs').readFileSync('prod/plan.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: '## PROD Plan\n```\n' + plan.slice(0, 50000) + '\n```'
            });
