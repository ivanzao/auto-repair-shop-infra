name: Terraform Apply

on:
  workflow_call:
    inputs:
      environment:
        description: Root directory and Terraform environment name (hml, prod)
        required: true
        type: string
      gh_environment:
        description: GitHub Environment used for deployment tracking/protection
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:     { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_SESSION_TOKEN:     { required: true }
      db_master_password:    { required: true }
      db_order_password:     { required: true }
      db_billing_password:   { required: true }
      db_user_password:      { required: true }
      ghcr_token:            { required: true }

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh_environment }}
    defaults:
      run:
        shell: bash
        working-directory: environments/${{ inputs.environment }}
    env:
      TF_VAR_db_master_password:      ${{ secrets.db_master_password }}
      TF_VAR_db_order_app_password:   ${{ secrets.db_order_password }}
      TF_VAR_db_billing_app_password: ${{ secrets.db_billing_password }}
      TF_VAR_db_user_app_password:    ${{ secrets.db_user_password }}
      TF_VAR_ghcr_token:              ${{ secrets.ghcr_token }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~> 1.10" }

      - name: Seed Lambda placeholder image
        run: |
          REPO=auto-repair-shop-lambda-placeholder
          REG="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.us-east-1.amazonaws.com"
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$REPO" >/dev/null
          if ! aws ecr describe-images --repository-name "$REPO" --image-ids imageTag=bootstrap >/dev/null 2>&1; then
            aws ecr get-login-password | docker login --username AWS --password-stdin "$REG"
            docker pull --platform linux/arm64 public.ecr.aws/lambda/provided:al2023
            docker tag public.ecr.aws/lambda/provided:al2023 "$REG/$REPO:bootstrap"
            docker push "$REG/$REPO:bootstrap"
          fi

      - name: Init
        run: |
          BUCKET="auto-repair-shop-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || {
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          }
          terraform init -backend-config="bucket=${BUCKET}"

      - name: Apply infra (VPC + EKS + RDS + module.k8s)
        run: terraform apply -auto-approve -target=module.infra.module.vpc -target=module.infra.module.eks -target=module.infra.module.rds -target=module.infra.module.k8s

      - name: Apply kubernetes manifests
        run: terraform apply -auto-approve
