name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-hml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hml
    env:
      TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
      TF_VAR_db_app_password:    ${{ secrets.DB_PASSWORD_HML }}
      TF_VAR_ghcr_token:         ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.10" }

      - name: Init
        run: |
          BUCKET="auto-repair-shop-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || {
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          }
          terraform init -backend-config="bucket=${BUCKET}"

      - name: Apply infra (VPC + EKS + RDS + module.k8s)
        run: terraform apply -auto-approve -target=module.vpc -target=module.eks -target=module.rds -target=module.k8s

      - name: Apply kubernetes manifests
        run: terraform apply -auto-approve

  deploy-prod:
    needs: deploy-hml
    if: needs.deploy-hml.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: prod
    env:
      TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
      TF_VAR_db_app_password:    ${{ secrets.DB_PASSWORD_PROD }}
      TF_VAR_ghcr_token:         ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.10" }

      - name: Init
        run: |
          BUCKET="auto-repair-shop-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          terraform init -backend-config="bucket=${BUCKET}"

      - name: Apply infra (VPC + EKS + RDS + module.k8s)
        run: terraform apply -auto-approve -target=module.vpc -target=module.eks -target=module.rds -target=module.k8s

      - name: Apply kubernetes manifests
        run: terraform apply -auto-approve
