name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ── HML DEPLOY ──────────────────────────────────────────────────────────────
  # Single stage. DB roles/databases are created by a Kubernetes Job inside
  # the cluster (modules/k8s/db-init.tf) — no self-hosted runner needed.
  deploy-hml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hml
    env:
      TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
      TF_VAR_db_app_password:    ${{ secrets.DB_PASSWORD_HML }}
      TF_VAR_ghcr_token:         ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.10" }

      - name: Init
        run: |
          BUCKET="auto-repair-shop-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || {
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          }
          terraform init -backend-config="bucket=${BUCKET}"

      # First-time bootstrap: kubernetes_manifest.otel_instrumentation needs
      # the cluster to exist BEFORE plan (kube provider needs to talk to API
      # server). Two-pass apply handles the cold start:
      #   pass 1: skip the manifest, build VPC+EKS+RDS+k8s
      #   pass 2: full apply (cluster now reachable)
      # On steady state, pass 1 is a no-op.
      # Two-pass apply: the kubernetes_manifest provider needs to talk to the
      # cluster API at plan time, so on a cold start it can't be planned before
      # the cluster exists. Step 1 builds the infra + everything in module.k8s
      # (helm releases included). Step 2 applies the standalone manifests like
      # otel_instrumentation that depend on CRDs from step 1.
      - name: Apply infra (VPC + EKS + RDS + module.k8s)
        run: terraform apply -auto-approve -target=module.vpc -target=module.eks -target=module.rds -target=module.k8s

      - name: Warm ECR PTC for Lambda images
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR="${ACCOUNT}.dkr.ecr.us-east-1.amazonaws.com"

          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin "$ECR"

          for LAMBDA in login authorizer email; do
            URL="${ECR}/ghcr-hml/ivanzao/auto-repair-shop-${LAMBDA}:latest"
            echo "Warming PTC: $URL"
            docker pull --platform linux/arm64 "$URL"
          done

      - name: Apply kubernetes manifests
        run: terraform apply -auto-approve

  # ── PROD DEPLOY ─────────────────────────────────────────────────────────────
  # Only runs if HML succeeded.
  deploy-prod:
    needs: deploy-hml
    if: needs.deploy-hml.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: prod
    env:
      TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
      TF_VAR_db_app_password:    ${{ secrets.DB_PASSWORD_PROD }}
      TF_VAR_ghcr_token:         ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.10" }

      - name: Init
        run: |
          BUCKET="auto-repair-shop-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          terraform init -backend-config="bucket=${BUCKET}"

      # Two-pass apply: the kubernetes_manifest provider needs to talk to the
      # cluster API at plan time, so on a cold start it can't be planned before
      # the cluster exists. Step 1 builds the infra + everything in module.k8s
      # (helm releases included). Step 2 applies the standalone manifests like
      # otel_instrumentation that depend on CRDs from step 1.
      - name: Apply infra (VPC + EKS + RDS + module.k8s)
        run: terraform apply -auto-approve -target=module.vpc -target=module.eks -target=module.rds -target=module.k8s

      - name: Warm ECR PTC for Lambda images
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR="${ACCOUNT}.dkr.ecr.us-east-1.amazonaws.com"

          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin "$ECR"

          for LAMBDA in login authorizer email; do
            URL="${ECR}/ghcr-prod/ivanzao/auto-repair-shop-${LAMBDA}:latest"
            echo "Warming PTC: $URL"
            docker pull --platform linux/arm64 "$URL"
          done

      - name: Apply kubernetes manifests
        run: terraform apply -auto-approve
