deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: ${loki_bucket}
      ruler: ${loki_bucket}
      admin: ${loki_bucket}
    s3:
      region: ${aws_region}
      s3forcepathstyle: false
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    # We still need a tiny scratch volume for WAL + compactor working set.
    # 2 GiB emptyDir is enough for the lab. Real chunks go to S3.
    enabled: false
  extraVolumes:
    - name: storage
      emptyDir:
        sizeLimit: 2Gi
  extraVolumeMounts:
    - name: storage
      mountPath: /var/loki

lokiCanary:
  enabled: true

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

gateway:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false
