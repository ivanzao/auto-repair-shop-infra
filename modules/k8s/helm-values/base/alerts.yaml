# PrometheusRule definitions injected into kube-prometheus-stack.
# Picked up by the Prometheus Operator and evaluated by Prometheus.
# Alertmanager (also installed by the chart) routes firing alerts.

additionalPrometheusRulesMap:
  auto-repair-shop-app:
    groups:
      - name: auto-repair-shop.app
        interval: 30s
        rules:
          # 1. HighOrderCreationErrors — taxa de 5xx em qualquer endpoint da app
          #    indica falha no processamento de ordens de serviço ou outras
          #    rotas críticas.
          - alert: HighOrderCreationErrors
            expr: |
              sum(rate(http_server_requests_seconds_count{job=~".*auto-repair-shop.*",status=~"5.."}[5m]))
                / sum(rate(http_server_requests_seconds_count{job=~".*auto-repair-shop.*"}[5m]))
                > 0.05
            for: 5m
            labels:
              severity: critical
              service: auto-repair-shop
            annotations:
              summary: "App está retornando >5% de 5xx (últimos 5m)"
              description: "Possível falha no processamento de ordens de serviço. Verificar logs e traces."

          # 2. AppPodCrashLooping — restarts em pods do namespace da app
          - alert: AppPodCrashLooping
            expr: |
              increase(kube_pod_container_status_restarts_total{namespace=~"auto-repair-shop-.*"}[15m]) > 2
            for: 5m
            labels:
              severity: critical
              service: auto-repair-shop
            annotations:
              summary: "Pod {{ $labels.pod }} reiniciou mais de 2x em 15m"
              description: "Container {{ $labels.container }} no namespace {{ $labels.namespace }} está em CrashLoop."

          # 3. HighLatency — p95 das respostas > 1s
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(http_server_requests_seconds_bucket{job=~".*auto-repair-shop.*"}[5m]))
              ) > 1
            for: 10m
            labels:
              severity: warning
              service: auto-repair-shop
            annotations:
              summary: "p95 latência > 1s (últimos 5m)"
              description: "Performance degradada nas APIs do auto-repair-shop. Avaliar CPU/memória dos pods e queries lentas no banco."

          # 4. AppTargetDown — Prometheus não consegue scrapear /metrics
          - alert: AppTargetDown
            expr: up{job=~".*auto-repair-shop.*"} == 0
            for: 3m
            labels:
              severity: critical
              service: auto-repair-shop
            annotations:
              summary: "Prometheus não consegue scrapear o app ({{ $labels.instance }})"
              description: "Healthcheck do scrape falhou por 3m. App pode estar down ou ServiceMonitor desconfigurado."
